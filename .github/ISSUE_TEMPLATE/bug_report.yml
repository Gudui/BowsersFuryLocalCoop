name: Bug report
description: Report a reproducible problem with the public release.
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Mod and game version
      description: Include the mod release and Bowser's Fury version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: State exactly who is where, what they are doing, and when the problem appears.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove personal paths, account names, and unrelated data before posting.
